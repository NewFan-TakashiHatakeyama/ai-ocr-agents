# ローカル/結合テスト用 compose（詳細設計 §14.1 結合テスト）
#
# 本番は ECS（ADR-0003）。この compose は ECS タスク定義のローカルプロキシ
# （1 service = 1 task definition）。ローカルで通した構成を deploy/ecs/ の task-def に写像する。
#
# 推論層（structure / ocr / vl）をまず起動し、paddle_client の契約テスト fixture 録画や
# ingest→orchestrator の E2E に使う。data 層（Postgres/Redis）は段階的に追加する。
#
# コスト最小トポロジ（ADR-0003 Option A）では structure/ocr は Fargate CPU 相当で動かす。
# GPU が要るのは vl-svc（既定無効）のみ。推論イメージタグは環境依存（付録C-1/C-4）。
#
# CPU バックエンド: `--engine onnxruntime` を付ける（Linux 実測 20.1s→7.9s = 2.5×、精度同一）。
#   イメージに onnxruntime / paddle2onnx が必要（無い場合は起動時に DependencyError）。
#   OpenVINO は PP-OCRv6_medium_rec を ultra-infer 1.2.0 が読めず不可（inference/README.md 参照）。

services:
  structure-svc:
    image: ${PADDLEX_SERVING_IMAGE:-ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr:latest}
    command: >-
      paddlex --serve
      --pipeline /configs/pipeline_config.yaml
      --host 0.0.0.0 --port 8080
      --engine onnxruntime
    volumes:
      - ./../inference/structure/pipeline_config.yaml:/configs/pipeline_config.yaml:ro
    ports:
      - "8081:8080"
    # GPU を使う場合は deploy.resources.reservations.devices を有効化
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ocr-svc:
    image: ${PADDLEX_SERVING_IMAGE:-ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr:latest}
    command: >-
      paddlex --serve
      --pipeline /configs/pipeline_config.yaml
      --host 0.0.0.0 --port 8080
    volumes:
      - ./../inference/ocr/pipeline_config.yaml:/configs/pipeline_config.yaml:ro
    ports:
      - "8082:8080"

  # vl-svc は PaddleOCR/deploy/paddleocr_vl_docker の compose（gateway + pipeline +
  # genai server）を基に別ファイルで構成する。GPU 専用プールに分離（§2.3）。
  # vl-svc:
  #   extends:
  #     file: ../PaddleOCR/deploy/paddleocr_vl_docker/hps/compose.yaml
  #     service: pipeline

  # --- data 層（結合テスト用, §14.1） ---
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: newfan
      POSTGRES_PASSWORD: newfan
      POSTGRES_DB: newfan
    ports:
      # 同一マシンに他の postgres がある場合は POSTGRES_HOST_PORT で衝突回避
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newfan"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  # マイグレーション適用（postgres 起動後に 1 回実行）。
  #   DATABASE_URL=postgresql://newfan:newfan@localhost:5432/newfan \
  #     uv run alembic -c db/alembic.ini upgrade head
  # （compose の migrate ジョブ化はイメージ整備後に追加）

volumes:
  pgdata:
