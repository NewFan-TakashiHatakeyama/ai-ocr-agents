[project]
name = "newfan-metrics"
version = "0.1.0"
description = "Prometheus メトリクス定義（§12.1）"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newfan_metrics"]
