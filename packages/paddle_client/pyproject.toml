[project]
name = "newfan-paddle-client"
version = "0.1.0"
description = "PaddleOCR サービングクライアント＋応答型（§5.3 / 付録C-1,C-3）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "newfan-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newfan_paddle_client"]
