[project]
name = "newfan-workflow"
version = "0.1.0"
description = "ワークフロー定義（graph_json）・構成 lint・条件式（§16 / docs/design/16-agent-workflow.md）"
requires-python = ">=3.12"
# 純ロジックに保つ（DB も HTTP も持たない）。gateway（保存時 lint）と
# orchestrator（実行時の解釈）の両方が import するため、どちらの重い依存も
# 引き込まないこと。normalizers / validators と同じ方針。
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newfan_workflow"]
