[project]
name = "newfan-ingest"
version = "0.1.0"
description = "取込・ページ分割・前処理（§5.1 / §5.2, DD-01）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "newfan-schemas",
]

[project.optional-dependencies]
# 実行時のみ必要（テストは Protocol の fake で代替）
runtime = [
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newfan_ingest"]
