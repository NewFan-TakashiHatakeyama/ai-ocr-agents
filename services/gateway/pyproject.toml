[project]
name = "newfan-gateway"
version = "0.1.0"
description = "gateway-api: REST/認証/HITL API（§6）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "newfan-schemas",
    "newfan-ingest",
]

[project.optional-dependencies]
# 本番の DB / キュー / サーバ（テストは InMemory 実装で代替）
runtime = [
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newfan_gateway"]
