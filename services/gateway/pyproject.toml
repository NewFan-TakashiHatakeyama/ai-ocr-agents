[project]
name = "newfan-gateway"
version = "0.1.0"
description = "gateway-api: REST/認証/HITL API（§6）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "newfan-schemas",
    "newfan-ingest",
]

[project.optional-dependencies]
# 本番の DB / キュー / サーバ（テストは InMemory 実装で代替）
# PgRepository は同期 SQLAlchemy(create_engine) + psycopg ドライバ（postgresql+psycopg://）。
# asyncpg は非同期専用で同期エンジンに使えないため psycopg を採用。
runtime = [
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    # gateway は in-process で ingest を実行するため取込 runtime（pypdfium2/pillow/boto3）が必要。
    "newfan-ingest[runtime]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newfan_gateway"]
