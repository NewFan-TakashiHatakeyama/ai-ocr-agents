[project]
name = "newfan-llm-adapter"
version = "0.1.0"
description = "llm-adapter: LLM/SLM 抽象・KIE/補正実行（§4.6 / §5.5）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "newfan-schemas",
]

[project.optional-dependencies]
# 本番プロバイダ（テストは FakeProvider で代替）
anthropic = [
    "anthropic>=0.116",
]
gemini = [
    "google-genai>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newfan_llm_adapter"]
