[project]
name = "newfan-export"
version = "0.1.0"
description = "export-svc: 確定データの JSON/CSV/Webhook 配信（§5.9 / §6.4）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "newfan-schemas",
]

[project.optional-dependencies]
runtime = [
    "boto3>=1.34",  # S3 保存
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newfan_export"]
