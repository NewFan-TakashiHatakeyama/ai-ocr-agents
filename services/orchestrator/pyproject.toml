[project]
name = "newfan-orchestrator"
version = "0.1.0"
description = "LangGraph 抽出グラフ（§4）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "newfan-schemas",
    "newfan-paddle-client",
    "newfan-normalizers",
    "newfan-validators",
    "newfan-llm-adapter",
    "newfan-memory",
]

[project.optional-dependencies]
# グラフ実行に必要（ノード/confidence/gate の単体ロジックは langgraph 非依存）
graph = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newfan_orchestrator"]
