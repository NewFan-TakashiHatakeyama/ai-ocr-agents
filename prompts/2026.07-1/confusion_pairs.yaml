# 混同文字表（詳細設計 付録A）。LLM 補正の許可集合（DD-10）。
# correction_logs から頻出ペアを四半期集計して更新する（更新はバンドル版として管理）。
digits_alpha:
  - ["1", "7", "I", "l", "|"]
  - ["0", "O", "o", "〇", "D"]
  - ["8", "B", "3"]
  - ["5", "S"]
  - ["6", "b"]
  - ["2", "Z"]
  - ["9", "g", "q"]
  - ["4", "A"]
symbols:
  - [".", ","]
  - ["-", "ー", "一", "〜"]
  - [":", ";"]
  - ["'", "`"]
  - ["¥", "Y"]
kana_kanji:
  - ["カ", "力"]
  - ["ロ", "口"]
  - ["ニ", "二"]
  - ["エ", "工"]
  - ["ハ", "八"]
  - ["タ", "夕"]
  - ["チ", "千", "干"]
  - ["未", "末"]
  - ["己", "已", "巳"]
  - ["士", "土"]
  - ["大", "太", "犬"]
  - ["貝", "具"]
  - ["間", "問"]
  - ["網", "綱"]
# 全半角は正規化で解決するため表対象外
