# 読取領域ヒント（Phase 4）。**region_px を持つ field がある run にだけ**
# kie_extract のプロンプト末尾へ追記する。
#
# kie_extract.yaml 本体に書いてはいけない: あのテンプレートは全 KIE 呼び出しが読むので、
# 領域を 1 つも使っていないテナントのプロンプトまで変わってしまう
# （「領域機能を使っていない run の挙動は一切変わらない」という受け入れ条件が壊れる）。
name: kie_region_hint
template: |

  # region_px（読取領域のヒント）がある場合
  スキーマの field に region_px:{page,bbox} があれば、それは「その項目は過去の同種
  帳票でこの位置付近にあった」という**ヒント**である。bbox は [x1,y1,x2,y2] の画素で、
  同じ入力の OCRスパン一覧に載っている bbox と同じ座標系である。
  - 同名候補が複数ある場合（指示5）は、region_px に近い候補を優先せよ。
  - **ヒントは絶対条件ではない**。レイアウトが異なる帳票では、領域から外れていても
    語彙と文脈から見て正しい値を優先せよ。領域内に該当が無いことを理由に
    value=null にしてはならない。
  - ヒントに従った場合も外れた場合も、span_ids は**実在するスパン**を指すこと。
    領域に合わせて座標や値を作ってはならない（指示2の根拠契約が優先する）。
