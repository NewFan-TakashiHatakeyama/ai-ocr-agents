# 読取領域ヒント（設計 region-field-add-and-hint-v2 §2.7）。**region_hint を持つ field が
# ある run にだけ** kie_extract のプロンプト末尾へ追記する。
#
# kie_extract.yaml 本体に書いてはいけない: あのテンプレートは全 KIE 呼び出しが読むので、
# 領域を 1 つも使っていないテナントのプロンプトまで変わってしまう
# （「領域機能を使っていない run の挙動は一切変わらない」という受け入れ条件が壊れる）。
#
# 座標は渡さない（D13）ので、「近く」「上」「右」のような空間的な語は使わない（D16）。
# 判断材料は候補の原文と例示値の「種類」だけである。出力形式への追加は無い（D15 の
# 従った／捨てたは span_ids と候補の集合演算でコードが決める）。
#
# 末尾の「この節は region_hint のある項目にだけ適用する」は第 3 回計測（2026-09-12）で
# 足した。S3（別雛形のテンプレート）で、ヒントを持たない issuer_address が介入アームで
# だけ 2 行目（建物名）を落とす（対照 5/5 → 介入 1/5）── ヒントの説明文が無関係な項目の
# 読み方まで変えていた（波及）。ヒントの節が他の項目に及ばないことを明示する。
# 値の範囲は「切り詰めるな」だけでなく「付け足すな」も書く。「複数行はすべて含めよ」と
# 住所を例に書いた版では、ヒントの無い住所に郵便番号まで付けて外した（(c)）。
# **項目の種類を例に挙げない**（挙げた種類の読み方だけが変わる）。
name: kie_region_hint
template: |

  # region_hint（読取領域のヒント）がある場合
  スキーマの field に region_hint があれば、それは「同じ種類の帳票で、前回その項目が
  この位置にあった」という情報である。
  - candidates: この帳票でその位置にある span（span_id と原文）。**まずここから探せ。**
  - example_value: 前回その位置にあった原文（無ければ null）。
  - example_present: 同じ原文がこの帳票の同じ位置にもある（true なら強い根拠）。

  **ヒントを捨てる基準**（次のいずれかに当てはまるなら candidates を使わず、文脈と
  語彙で決めよ）:
  - candidates の原文が項目の種類と合わない（会社名の項目なのに候補が住所・建物名・
    日付・数量など）。
  - example_value がある場合に、候補の種類が example_value と合わない
    （会社名 vs 建物名、金額 vs 番号 など）。
  - 別の場所に、見出し（「合計」「請求先」など）付きで同じ種類の値がある。

  ヒントを捨てても value=null にしてはならない。捨てた場合は文脈から探せ。
  ヒントに従った場合も捨てた場合も、span_ids は**実在する span** を指すこと
  （指示 2 の根拠契約が優先する）。

  **この節は region_hint のある項目にだけ適用する。** region_hint の無い項目は、
  ヒントが無いときとまったく同じに指示 1〜5 で抽出せよ。ヒントの有無にかかわらず、
  値にどの span を含めるかは指示 1〜5 のとおりに決め、この節を理由に値を切り詰めたり
  （一部の span だけにする）、付け足したり（普段は含めない span を加える）してはならない。
