name: CD (build & push to ECR)

# タグ push（v*）または手動実行で 5 イメージを ECR へ push。
# 事前準備: OIDC 用 IAM ロール（secrets.AWS_ROLE_ARN）、vars.AWS_REGION、ECR リポジトリ
# （deploy/terraform で作成）。ECS デプロイ（run-task migrate → service update）は別途。
#
# repo 名は deploy/terraform の local.images（${name_prefix}-<image>）と一致させること。
# 食い違うと push 先が無く CD が落ちる。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "イメージタグ（未指定時は git ref 名）"
        required: false

permissions:
  id-token: write # OIDC
  contents: read

jobs:
  push:
    name: build & push ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: gateway, repo: ai-ocr-gateway }
          - { image: orchestrator-worker, repo: ai-ocr-orchestrator-worker }
          - { image: export-worker, repo: ai-ocr-export-worker }
          - { image: migrate, repo: ai-ocr-migrate }
          # 推論はモデル焼き込みで 4.8GB。structure-svc / ocr-svc が同一イメージを共有する。
          - { image: inference, repo: ai-ocr-inference }
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.event.inputs.image_tag || github.ref_name }}
        run: |
          docker build -f deploy/docker/${{ matrix.image }}.Dockerfile \
            -t "$REG/${{ matrix.repo }}:$TAG" .
          docker push "$REG/${{ matrix.repo }}:$TAG"
